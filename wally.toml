[package]
name = "dyscarn/dysconnect"
description = "Lightweight, optimized networking library for Roblox with a unified API for remote events, unreliable remote events, remote functions, and bindable events. Features named connections, callback registration, predicate validation, connection management, and network traffic protection."
version = "0.1.0"
license = "MIT"
authors = ["Dyscarn"]
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
homepage = "https://dyscarn.github.io/Dysconnect/"
repository = "https://github.com/Dyscarn/Dysconnect"

exclude = ["*"]
include = ["src", "src/**", "LICENSE.md", "wally.toml", "README.md"]
